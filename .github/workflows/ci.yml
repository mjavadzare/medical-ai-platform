name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch, serving, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-serve.txt
          pip install pytest httpx ruff
          pip install --no-deps --no-build-isolation -e .

      - name: Lint serving, inference, XAI, and test code with Ruff
        run: ruff check app modules/diabetic_retinopathy/inference shared/explainability/gradcam.py tests

      - name: Run automated test suite
        run: pytest -v

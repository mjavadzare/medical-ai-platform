services:
  dr-api:
    build:
      context: ..
      dockerfile: mlops/Dockerfile
    container_name: medical-ai-dr-api
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: ResNet50_layer3_layer4_ft_bn_frozen_focal
      CAM_METHOD: gradcam++
      CAM_LAYER: layer4
      CALIBRATION_TEMPERATURE: "0.9196"
      TRIAGE_CONFIDENCE_THRESHOLD: "0.75"
      TRIAGE_ENTROPY_THRESHOLD: "1.05"
      DATABASE_URL: sqlite:////app/storage/medical_ai.db
    volumes:
      - ../modules/diabetic_retinopathy/artifacts/checkpoints:/app/modules/diabetic_retinopathy/artifacts/checkpoints:ro
      - dr_sqlite_data:/app/storage
    restart: unless-stopped
  dr-ui:
    build:
      context: ..
      dockerfile: mlops/Dockerfile.ui
    container_name: medical-ai-dr-ui
    ports:
      # Mapped to host 8502 to avoid Windows/WSL2 port 8501 conflict
      - "8502:8501"
    environment:
      - API_BASE_URL=http://dr-api:8000
    volumes:
      # Read-only mount so the local diagnostic samples dropdown works in Docker
      - ../data/samples:/app/data/samples:ro
    depends_on:
      - dr-api
    restart: unless-stopped
volumes:
  dr_sqlite_data:

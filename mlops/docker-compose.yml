services:
  dr-api:
    build:
      context: ..
      dockerfile: mlops/Dockerfile
    container_name: medical-ai-dr-api
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: ResNet50_layer3_layer4_ft_bn_frozen_focal
      CAM_METHOD: gradcam++
      CAM_LAYER: layer4
      CALIBRATION_TEMPERATURE: "1.0"
      TRIAGE_CONFIDENCE_THRESHOLD: "0.75"
      TRIAGE_ENTROPY_THRESHOLD: "1.05"
      DATABASE_URL: sqlite:////app/storage/medical_ai.db
    volumes:
      - ../modules/diabetic_retinopathy/artifacts/checkpoints:/app/modules/diabetic_retinopathy/artifacts/checkpoints:ro
      - dr_sqlite_data:/app/storage
    restart: unless-stopped

volumes:
  dr_sqlite_data:
